# Локальное окружение: PostgreSQL + сам сервис.
#
# Всё сразу:      docker compose up -d --build   (сервис на http://localhost:8080)
# Логи сервиса:   docker compose logs -f app
# Только база:    docker compose up -d postgres  (а сервис — через `go run ./cmd/server`)
# Статус:         docker compose ps
# Консоль БД:     docker compose exec postgres psql -U moex -d moex
# Остановить:     docker compose down            (данные сохранятся)
# Снести всё вместе с данными: docker compose down -v
#
# Java-параллель: то же, что поднимать Spring Boot-приложение и БД одним
# compose-файлом. Для разработки удобнее держать в Docker только базу,
# а сервис запускать с хоста — перезапуск за секунду без пересборки образа.

services:
  postgres:
    image: postgres:18
    environment:
      # Учебные креды для локальной машины. Позже вынесем в .env (он в .gitignore).
      POSTGRES_USER: moex
      POSTGRES_PASSWORD: moex
      POSTGRES_DB: moex
    ports:
      - "5432:5432"
    volumes:
      # ВАЖНО: с Postgres 18 том монтируется в /var/lib/postgresql,
      # а не в /var/lib/postgresql/data, как в старых туториалах.
      # Образ сам кладёт данные в подкаталог 18/docker — это упрощает
      # будущие апгрейды мажорной версии через pg_upgrade.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # pg_isready отвечает "готов", только когда БД реально принимает соединения.
      # На него опирается depends_on сервиса app (condition: service_healthy).
      test: ["CMD-SHELL", "pg_isready -U moex -d moex"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Образ собирается из Dockerfile в корне проекта.
    build: .
    ports:
      - "8080:8080"
    environment:
      # Внутри сети compose база доступна по имени сервиса "postgres",
      # а не по localhost: localhost внутри контейнера — это сам контейнер.
      DATABASE_URL: postgres://moex:moex@postgres:5432/moex?sslmode=disable
    depends_on:
      postgres:
        # Ждать не просто запуска контейнера, а успешного healthcheck:
        # иначе сервис стартует раньше, чем БД начнёт принимать соединения,
        # и упадёт на ping при старте.
        condition: service_healthy
    # Если сервис упал (например, база временно недоступна) — перезапустить.
    restart: unless-stopped

volumes:
  # Именованный том: данные переживают `docker compose down`,
  # удаляются только с флагом -v.
  pgdata:
